on:
  push:
    branches: main
    paths:
      - data/saga.csv
  workflow_dispatch:

name: Render

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install R
        uses: r-lib/actions/setup-r@v2

      - name: Install R packages
        uses: r-lib/actions/setup-r-dependencies@v2
        with:
          packages: |
            any::ggplot2
            any::ggtext
            any::readr
            any::sysfonts
            any::showtext
            any::svglite
            any::jsonlite

      - name: Render figures
        shell: bash
        run: Rscript scripts/saga.r

      - name: Land the figures
        uses: mcanouil/release-actions/land@v1
        with:
          mode: pull-request
          files: media
          message: "ci: automatic figure rendering"
          branch: ci/render-figures
          allow-unchanged: true
